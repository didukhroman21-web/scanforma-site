# Статичний сайт ScanForma на Render (безкоштовний тариф). index.html уже повний документ, збирати нічого.
services:
  - type: web
    runtime: static
    name: scanforma-site
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
